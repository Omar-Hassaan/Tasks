<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Example</title>
</head>
<body>
    <h1>HTML Form Example</h1>
        <p>
            This is an example of an <del>HTML4</del>  <u>HTML5</u>  form containing يحتوي various <mark>input</mark>  controls:
        </p>
    <form>
        <fieldset>
            <legend>User Information</legend>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </fieldset>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <br>
            <br>
            <label for="Message">Message:</label>
            <br>
            <textarea id="message" name="message" style="height: 70px; width: 20%;"></textarea>
        </fieldset>
        <fieldset>
            <legend>Subscriptions</legend>
            <label for="newsletter">Subscribe to newsletter:</label>
            <input type="checkbox" id="newsletter" name="newsletter">
            <br>
            <label for="newsletter">Subscribe to newsletter:</label>
            <input type="checkbox" id="newsletter" name="newsletter">
        </fieldset>
        <fieldset>
            <legend>Preferred Language</legend>
            <label for="language">Select your preferred Language:</label>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Feedback</legend>
            <label for="feedback">Please provide your feedback:</label>
            <br>
            <label for="rating">Rate our service:</label>
            <input type="range" id="rating" name="rating" min="1" max="10">
        </fieldset>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
